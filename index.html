<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sueldo de alcaldes ISPA 2025</title>

  <!-- MapLibre GL JS (open source, sin costes) -->
  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- PMTiles plugin -->
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>

  <!-- Geocoder (compatible con MapLibre) -->
  <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
  <link href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css" rel="stylesheet" />

  <!-- Turf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  <style>
    :root {
      --accent: #01f3b3;
      --accent-dark: #00b38a;
      --ink: #16191b;
      --ink-muted: #666f6d;
      --line: #d9dcda;
      --panel: #ffffff;
      --radius: 0px;
      --shadow-toolbar: 0 1px 2px rgba(15, 23, 22, 0.06), 0 8px 20px rgba(15, 23, 22, 0.06);
      --shadow-pop: 0 10px 28px rgba(15, 23, 22, 0.18);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      color: var(--ink);
      background: #eef0ef;
    }

    #map-container {
      position: relative;
      width: 100%;
      height: 100vh;
      max-width: none;
      margin: 0;
      background: transparent;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .controls-container {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 920px;
      padding: 0 12px;
      z-index: 1000;
      pointer-events: none;
    }

    .controls-container > * {
      pointer-events: auto;
    }

    .toolbar {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-toolbar);
    }

    .toolbar-segment {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 16px;
      border-left: 1px solid var(--line);
    }

    .toolbar-segment:first-child {
      border-left: none;
    }

    .toolbar-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-muted);
      margin-bottom: 3px;
    }

    .toolbar-segment--dedication {
      min-width: 168px;
    }

    #dedicationFilter {
      width: 100%;
      padding: 3px 22px 3px 0;
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%),
                        linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
      background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    #dedicationFilter:focus {
      outline: 2px solid var(--accent-dark);
      outline-offset: 2px;
    }

    .toolbar-segment--random {
      justify-content: center;
      padding: 6px 12px;
    }

    .random-btn {
      border: 1px solid var(--accent-dark);
      outline: none;
      padding: 7px 16px;
      border-radius: var(--radius);
      background: var(--accent-dark);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .random-btn:hover {
      background: #ffffff;
      color: var(--accent-dark);
    }

    .random-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .toolbar-segment--salary {
      min-width: 220px;
    }

    .toolbar-segment-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .toolbar-segment-head .toolbar-label {
      margin-bottom: 0;
    }

    .salary-value {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      white-space: nowrap;
    }

    #salaryFilter {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 0;
      outline: none;
      background: linear-gradient(to right, var(--line) 0%, var(--accent-dark) 0%);
      transition: background 0.2s ease;
      align-self: center;
    }

    #salaryFilter::-webkit-slider-runnable-track {
      height: 4px;
    }

    #salaryFilter::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 5px;
      height: 18px;
      background: var(--ink);
      border-radius: 0;
      cursor: pointer;
      margin-top: -7px;
      transition: background 0.15s ease;
    }

    #salaryFilter:hover::-webkit-slider-thumb,
    #salaryFilter:focus::-webkit-slider-thumb {
      background: var(--accent-dark);
    }

    #salaryFilter::-moz-range-track {
      height: 4px;
    }

    #salaryFilter::-moz-range-thumb {
      width: 5px;
      height: 18px;
      background: var(--ink);
      border: none;
      border-radius: 0;
      cursor: pointer;
    }

    #salaryFilter:hover::-moz-range-thumb,
    #salaryFilter:focus::-moz-range-thumb {
      background: var(--accent-dark);
    }

    #geocoder-container {
      min-width: 220px;
      max-width: 280px;
      justify-content: center;
    }

    .maplibregl-ctrl-geocoder {
      position: relative;
      width: auto !important;
      max-width: 260px;
      min-width: 200px;
      box-shadow: none !important;
      border: none !important;
      background: transparent;
      overflow: visible !important;
      border-radius: 0 !important;
    }

    .maplibregl-ctrl-geocoder input.maplibregl-ctrl-geocoder--input {
      height: 28px;
      line-height: 28px;
      border-radius: 0 !important;
      padding: 0 8px 0 26px;
      font-size: 12px;
      background: transparent !important;
    }

    .maplibregl-ctrl-geocoder .suggestions {
      background: var(--panel);
      border: 1px solid var(--line) !important;
      border-radius: 0 !important;
      box-shadow: var(--shadow-pop) !important;
      overflow-x: hidden;
      overflow-y: auto;
      max-height: 60vh;
      width: 280px !important;
      z-index: 99999 !important;
    }

    .maplibregl-ctrl-geocoder .suggestions > li > a {
      min-width: 0;
    }

    .maplibregl-ctrl-geocoder--suggestion {
      min-width: 0;
    }

    .maplibregl-ctrl-geocoder--suggestion-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .maplibregl-ctrl-geocoder--suggestion-title,
    .maplibregl-ctrl-geocoder--suggestion-address {
      display: block;
      max-width: 100%;
    }

    .maplibregl-ctrl-geocoder .maplibregl-ctrl-geocoder--icon {
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--ink-muted);
    }

    .maplibregl-ctrl-geocoder input {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: var(--ink);
    }

    .maplibregl-ctrl-geocoder input:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    .maplibregl-popup {
      border: none !important;
    }

    .maplibregl-popup-content {
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .popup-container {
      font-family: var(--font-main);
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-pop);
      max-width: 280px;
    }

    .popup-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }

    .popup-ayuntamiento {
      font-weight: 700;
      font-size: 16px;
    }

    .popup-provincia {
      color: var(--ink-muted);
      font-size: 14px;
    }

    .popup-body {
      margin: 8px 0;
      padding: 8px 0;
    }

    .popup-nombre {
      font-size: 13px;
      font-weight: 600;
    }

    .popup-dedicacion,
    .popup-partido {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .popup-sueldo {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 8px 10px;
      border-radius: 0;
      white-space: nowrap;
      margin-top: 4px;
    }

    .maplibregl-popup-close-button {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
      transition: color 0.2s ease;
    }

    .maplibregl-popup-close-button:hover {
      color: var(--ink);
    }

    @media (max-width: 720px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-segment {
        border-left: none;
        border-top: 1px solid var(--line);
        min-width: 0;
      }

      .toolbar-segment:first-child {
        border-top: none;
      }

      #geocoder-container {
        max-width: none;
      }

      .maplibregl-ctrl-geocoder {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div id="map-container">
    <div id="map"></div>

    <div class="controls-container">
      <div class="toolbar">
        <div id="dedicationFilterContainer" class="toolbar-segment toolbar-segment--dedication">
          <label for="dedicationFilter" class="toolbar-label">Dedicación</label>
          <select id="dedicationFilter">
            <option value="all">Todas</option>
            <option value="Exclusiva">Exclusiva</option>
            <option value="Parcial">Parcial</option>
            <option value="Sin dedicación">Sin dedicación</option>
            <option value="No han remitido información al ISPA">No ha informado al ISPA</option>
          </select>
        </div>

        <div class="toolbar-segment toolbar-segment--random">
          <button id="randomLocation" class="random-btn">Ayuntamiento aleatorio</button>
        </div>

        <div class="toolbar-segment toolbar-segment--salary">
          <div class="toolbar-segment-head">
            <label for="salaryFilter" class="toolbar-label">Sueldo mínimo</label>
            <div id="salaryValue" class="salary-value">0 €</div>
          </div>
          <input id="salaryFilter" type="range" min="0" max="100000" step="1000" value="0">
        </div>

        <div id="geocoder-container" class="toolbar-segment toolbar-segment--geocoder"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
